<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Verse Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 40px; }
        .form-container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; }
        textarea, input[type="url"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { margin-top: 20px; width: 100%; background: #007bff; color: white; border: none; padding: 12px; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Upload Daily Content</h2>

        <!-- The action="/publish-daily" matches your Flask route exactly -->
        <!-- enctype="multipart/form-data" allows your image file to be sent safely -->
        <form action="/publish-daily" method="POST" enctype="multipart/form-data">

            <label for="verse">Verse of the Day Text:</label>
            <textarea id="verse" name="verse" rows="4" placeholder="Enter scripture and message here..." required></textarea>

            <label for="youtube_url">YouTube Video URL:</label>
            <input type="url" id="youtube_url" name="youtube_url" placeholder="https://youtube.com...">

            <label for="image_file">Upload Daily Image:</label>
            <input type="file" id="image_file" name="image_file" accept="image/*" required>

            <button type="submit">Publish to Site & Socials</button>
        </form>
    </div>

</body>
</html>
